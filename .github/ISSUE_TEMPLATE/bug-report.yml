name: 🐛 Bug Report
description: Report a problem with the Overleaf skill
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
  - type: input
    id: version
    attributes:
      label: Version
      description: olcli version or commit hash
      placeholder: "0.1.6"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output (optional)
      render: shell
